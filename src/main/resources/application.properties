spring.application.name=ms-digitalfix-workorders

spring.datasource.url=jdbc:oracle:thin:@digitalix_low?TNS_ADMIN=${DB_WALLET_PATH}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:digitalfix}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:digitalfix123}

spring.rabbitmq.connection-timeout=5000

# Kafka desactivado inicialmente
app.kafka.enabled=${KAFKA_ENABLED:false}

# Conexion con los brokers Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}

# Serializadores del productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Confirmacion y entrega de mensajes
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Topico de eventos de ordenes
app.kafka.topics.workorders=digitalfix.ordenes.eventos